# =============================================================================
# Crystal Studio —— 一键起（后端 + 前端，一个容器全包）
#
#   1) 起：    cd docker;  docker compose up -d --build
#   2) 验：    ./verify.sh          （Windows：.\verify.ps1）
#   3) 看：    http://<本机或 NAS 的 IP>:8080/
#
# ⚠ 构建上下文是**仓库根**（本目录的上一级 `..`），dockerfile 是 `docker/Dockerfile`。
#   独立 clone 后目录名叫什么都可以（`CrystalStudio-Rust` / `crystal-studio` / …）：
#   `crates/mir2-assets` 对解码器的依赖是**仓库内相对路径** `vendor/wil2atlas`，
#   不再假设「上一级还并列着一个 wil2atlas/」。
#
# 镜像里自带二进制与静态前端；下面四个卷是**数据**，缺省指向本目录下的空占位目录
# （首次 `up` 时由 Docker 自动创建）⇒ 不挂真数据也能起，但 /api/map/open、/api/tiles、
# /api/stamps 会如实返回 404/503（**不伪造数据**）。要真数据请设下面四个环境变量。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 主服务：miredit-web（axum HTTP + WebSocket）+ 内置静态前端，单端口 8080
  # ---------------------------------------------------------------------------
  miredit:
    build:
      context: ..                          # = 仓库根（必须，见文件头）
      dockerfile: docker/Dockerfile
      target: runtime                     # 后端+前端；要 nginx 前置层请用 profile: front
    image: crystalstudio/miredit:dev
    container_name: miredit
    ports:
      # 宿主端口可用 MIREDIT_PORT 覆盖，如 MIREDIT_PORT=18080 docker compose up -d
      - "${MIREDIT_PORT:-8080}:8080"
    environment:
      # 容器内固定监听 0.0.0.0:8080；改端口请改上面的 ports 映射，别改这里
      MIREDIT_BIND: "0.0.0.0:8080"
      MIREDIT_MAP_ROOT: "/data/maps"
      MIREDIT_WEB_ROOT: "/app/web"
      MIREDIT_CLIENT_ROOT: "/data/client"
      # ⚠ 必须落在 <dataRoot>/catalogue/palette.json：
      #   mir2-stamp 用 dataRoot/objectRoot 定位 .X，palette.json 里 objectRoot="Objects"
      #   ⇒ dataRoot 必须是 /data/crystalstudio，而不是 /data/client
      MIREDIT_PALETTE_JSON: "/data/crystalstudio/catalogue/palette.json"
    volumes:
      # ---- 地图（.map）：/api/map/open 的白名单根 ----------------------------
      - "${MIREDIT_MAP_DIR:-./data/maps}:/data/maps:ro"
      # ---- 图库（.wil/.wzl/.wix/.wzx）：/api/tiles、/api/palette ------------
      # 客户端根（二十多 GB），只读挂载不复制
      - "${MIREDIT_CLIENT_DIR:-./data/client}:/data/client:ro"
      # ---- 印章目录：catalogue/ 与 Objects/ 必须并列在同一个 dataRoot 下 ----
      - "${MIREDIT_CATALOGUE_DIR:-./data/crystalstudio/catalogue}:/data/crystalstudio/catalogue:ro"
      - "${MIREDIT_OBJECTS_DIR:-./data/crystalstudio/Objects}:/data/crystalstudio/Objects:ro"
    healthcheck:
      # 探 /api/health（不是 /）：/ 依赖静态目录，拿它当健康判据会把「没挂静态」误判成「进程挂了」
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # 后端接了 SIGTERM 会优雅关闭（main.rs 的 shutdown_signal）
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # 可选前置层：nginx（静态页 + gzip + /api/ 反代），默认**不启用**
  #
  #   docker compose --profile front up -d --build
  #   然后访问 http://<IP>:8081/  （前端走 nginx，/api/ 反代到 miredit:8080）
  #
  # 为什么不放进默认编排：多一跳反代就多一处首启失败点（nginx 启动时就要解析
  # upstream 主机名）。默认路径直连后端，最少失败点。
  # ---------------------------------------------------------------------------
  front:
    profiles: ["front"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    image: crystalstudio/miredit-front:dev
    container_name: miredit-front
    ports:
      - "${MIREDIT_FRONT_PORT:-8081}:8080"
    environment:
      # 浏览器侧后端根：留空 = 同源（由 nginx 反代，推荐）
      MIREDIT_API_BASE: ""
      MIREDIT_MODE: "auto"
      # 容器侧反代目标：entrypoint.sh 据此把 /api/ 从 503 桩换成真反代
      MIREDIT_API_UPSTREAM: "http://miredit:8080"
    depends_on:
      # 必须等后端 healthy 再起 nginx：nginx 在配置加载阶段就要解析 `miredit` 主机名，
      # 后端没就绪时 nginx 会直接退出（不是"稍后重试"）
      miredit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
