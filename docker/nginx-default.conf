# =============================================================================
# nginx 站点配置（可选前置层，compose profile: front）
# 覆盖镜像自带的 /etc/nginx/conf.d/default.conf，监听 8080（非 root 不能绑 80）
# =============================================================================
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 静态资源压缩（都是文本类，瓦片 PNG 不压）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 入口页不缓存：改了前端要能立刻看到
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # 静态瓦片夹具：文件名固定，可短缓存
    location /tiles/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # /api/ 的落点：默认 503 桩；设置 MIREDIT_API_UPSTREAM 后由 entrypoint.sh 换成反代
    # ⚠ 反代写法必须是 `proxy_pass http://host:port;`（**结尾不带 /**）：
    #   带斜杠会把 `/api/health` 改写成 `/health` 转发出去，后端只有 `/api/health` ⇒ 404。
    include /etc/nginx/conf.d/api-location.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
