[package]
name = "mir2-assets"
version = "0.1.0"
edition = "2021"
description = "传奇 M2 `.wil/.wix/.wz*` 图库解码层（地图编辑器渲染地基）"
license = "MIT"

[dependencies]
# 解码实现全部复用 `tools/wil2atlas`，本 crate 不复制任何二进制解析代码。
# 路径相对本清单目录（crates/mir2-assets）：`../../../wil2atlas` = `tools/wil2atlas`。
wil2atlas = { path = "../../../wil2atlas" }

[dev-dependencies]
# 仅测试用：读客户端已烘焙的图集 PNG，做逐像素比对（验收门 1）。
# 与 wil2atlas 保持同一版本/同一组 feature，避免解析结果出现版本差异。
image = { version = "0.25", default-features = false, features = ["png"] }
